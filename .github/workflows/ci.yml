name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Test 🧪
        run: pnpm test

      - name: Build 🏗️
        run: pnpm build
